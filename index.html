<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的逐章節讀書筆記與內化系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            BookOpen, Calendar, Clock, Plus, Trash2, Edit3, CheckCircle2, 
            RefreshCw, Eye, EyeOff, FileText, Download, Upload, Cloud, 
            Sparkles, ChevronRight, Layers, ArrowLeftRight, Check, AlertCircle 
        } = lucideReact;

        // 預設示範資料結構
        const INITIAL_BOOKS = [
            {
                id: 'book-1',
                title: '卡片盒筆記',
                author: 'Sönke Ahrens',
                startDate: '2026-11-01',
                endDate: '2026-11-10',
                status: 'reading', // reading, completed
                purpose: '建立高效的知識萃取與永久筆記工作流，解決讀完容易忘記的問題。',
                tags: ['知識管理', '思維模型'],
                chapters: [
                    {
                        id: 'ch-1',
                        title: 'Ch.1 序言與核心概念',
                        readDate: '2026-11-01',
                        durationMinutes: 45,
                        notes: [
                            {
                                id: 'note-1',
                                quote: '寫筆記不是為了蒐集資訊，而是為了思考與對話。',
                                output: '我常把劃線當成收集，但作者點醒我：如果沒有用自己的話重新表述，那只是把書本搬到筆記本裡，大腦根本沒有運作。',
                                action: '以後劃線後強制停留 2 分鐘，寫下一句自己的白話文解讀。',
                                timestamp: '2026-11-01 21:30'
                            }
                        ]
                    }
                ],
                synthesis: '',
                actions: [],
                reviews: [
                    { times: 1, date: '', done: false },
                    { times: 2, date: '', done: false },
                    { times: 3, date: '', done: false }
                ]
            }
        ];

        function App() {
            const [books, setBooks] = useState(() => {
                const saved = localStorage.getItem('reading_notes_books');
                return saved ? JSON.parse(saved) : INITIAL_BOOKS;
            });

            const [activeTab, setActiveTab] = useState('daily'); // 'daily' 或 'books'
            const [selectedBookId, setSelectedBookId] = useState(books[0]?.id || '');
            const [todayDate, setTodayDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [hideQuotes, setHideQuotes] = useState(false); // 內化檢測模式
            
            // 雲端同步設定 Modal 狀態
            const [showSyncModal, setShowSyncModal] = useState(false);
            const [githubToken, setGithubToken] = useState(() => localStorage.getItem('gh_token') || '');
            const [gistId, setGistId] = useState(() => localStorage.getItem('gh_gist_id') || '');
            const [syncStatus, setSyncStatus] = useState('');

            // 計時碼錶狀態
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [secondsElapsed, setSecondsElapsed] = useState(0);
            const timerRef = useRef(null);

            // 自動儲存到 LocalStorage
            useEffect(() => {
                localStorage.setItem('reading_notes_books', JSON.stringify(books));
            }, [books]);

            // 計時器邏輯
            useEffect(() => {
                if (isTimerRunning) {
                    timerRef.current = setInterval(() => {
                        setSecondsElapsed(prev => prev + 1);
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isTimerRunning]);

            const formatTime = (totalSeconds) => {
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                return `${mins}分 ${secs}秒`;
            };

            // 新增書籍
            const handleAddBook = () => {
                const newBook = {
                    id: 'book-' + Date.now(),
                    title: '新書籍名稱',
                    author: '作者',
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: '',
                    status: 'reading',
                    purpose: '寫下你閱讀本書的核心目的...',
                    tags: ['新分類'],
                    chapters: [
                        {
                            id: 'ch-' + Date.now(),
                            title: 'Ch.1 第一章',
                            readDate: new Date().toISOString().split('T')[0],
                            durationMinutes: 30,
                            notes: [
                                {
                                    id: 'note-' + Date.now(),
                                    quote: '在此輸入觸動你的原文金句...',
                                    output: '用自己的話輸出這句話的含義與連結...',
                                    action: '想執行的微小行動...',
                                    timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16)
                                }
                            ]
                        }
                    ],
                    synthesis: '',
                    actions: [],
                    reviews: [
                        { times: 1, date: '', done: false },
                        { times: 2, date: '', done: false },
                        { times: 3, date: '', done: false }
                    ]
                };
                setBooks([newBook, ...books]);
                setSelectedBookId(newBook.id);
            };

            // 匯出 JSON 備份
            const handleExportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(books, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `reading_notes_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            // 匯入 JSON 備份
            const handleImportJSON = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = event => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            setBooks(parsed);
                            alert('資料匯入成功！');
                        } catch (err) {
                            alert('檔案格式錯誤，無法解析 JSON。');
                        }
                    };
                }
            };

            // GitHub Gist 雲端同步功能
            const handleSyncToGist = async () => {
                if (!githubToken) {
                    alert('請先輸入 GitHub Personal Access Token (PAT)');
                    setShowSyncModal(true);
                    return;
                }
                setSyncStatus('正在同步至雲端...');
                try {
                    localStorage.setItem('gh_token', githubToken);
                    const content = JSON.stringify(books, null, 2);
                    let currentGistId = gistId;

                    if (!currentGistId) {
                        // 建立新的 Secret Gist
                        const res = await fetch('https://api.github.com/gists', {
                            method: 'POST',
                            headers: {
                                'Authorization': `token ${githubToken}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                description: 'My Reading Notes Cloud Database',
                                public: false,
                                files: {
                                    'reading_notes_db.json': { content }
                                }
                            })
                        });
                        const data = await res.json();
                        if (data.id) {
                            currentGistId = data.id;
                            setGistId(currentGistId);
                            localStorage.setItem('gh_gist_id', currentGistId);
                        } else {
                            throw new Error(data.message || '建立 Gist 失敗');
                        }
                    } else {
                        // 更新現有 Gist
                        const res = await fetch(`https://api.github.com/gists/${currentGistId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `token ${githubToken}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                files: {
                                    'reading_notes_db.json': { content }
                                }
                            })
                        });
                        if (!res.ok) throw new Error('更新 Gist 失敗');
                    }
                    setSyncStatus('✅ 雲端同步成功！');
                    setTimeout(() => setSyncStatus(''), 3000);
                } catch (err) {
                    setSyncStatus(`❌ 同步失敗: ${err.message}`);
                }
            };

            const handleFetchFromGist = async () => {
                if (!githubToken || !gistId) {
                    alert('請先輸入 GitHub Token 與 Gist ID');
                    setShowSyncModal(true);
                    return;
                }
                setSyncStatus('正在從雲端載入...');
                try {
                    localStorage.setItem('gh_token', githubToken);
                    localStorage.setItem('gh_gist_id', gistId);
                    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                        headers: { 'Authorization': `token ${githubToken}` }
                    });
                    const data = await res.json();
                    if (data.files && data.files['reading_notes_db.json']) {
                        const remoteData = JSON.parse(data.files['reading_notes_db.json'].content);
                        setBooks(remoteData);
                        setSyncStatus('✅ 成功從雲端載入最新筆記！');
                        setTimeout(() => setSyncStatus(''), 3000);
                    } else {
                        throw new Error('找不到雲端備份檔案');
                    }
                } catch (err) {
                    setSyncStatus(`❌ 載入失敗: ${err.message}`);
                }
            };

            // 篩選今天有閱讀紀錄（readDate === todayDate）的書籍與章節
            const todaysReadings = books.map(book => {
                const matchedChapters = book.chapters.filter(ch => ch.readDate === todayDate);
                return matchedChapters.length > 0 ? { ...book, activeChapters: matchedChapters } : null;
            }).filter(Boolean);

            const currentBook = books.find(b => b.id === selectedBookId) || books[0];

            return (
                <div className="min-h-screen pb-16">
                    {/* 頂部導覽列 */}
                    <header className="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-lg text-white">
                                    <BookOpen className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold">逐章節讀書筆記與內化系統</h1>
                                    <p className="text-xs text-slate-400">輸入原文金句 ➔ 我的話語轉化 ➔ 跨裝置雲端同步</p>
                                </div>
                            </div>

                            {/* 視角切換 Tabs */}
                            <div className="flex items-center bg-slate-800 p-1 rounded-xl">
                                <button 
                                    onClick={() => setActiveTab('daily')}
                                    className={`px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2 ${activeTab === 'daily' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                >
                                    <Calendar className="w-4 h-4" /> 今日跨書工作台
                                </button>
                                <button 
                                    onClick={() => setActiveTab('books')}
                                    className={`px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2 ${activeTab === 'books' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                >
                                    <Layers className="w-4 h-4" /> 單書完整脈絡
                                </button>
                            </div>

                            {/* 右上角工具列：計時器與雲端同步按鈕 */}
                            <div className="flex items-center gap-2">
                                <div className="hidden lg:flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg text-xs">
                                    <Clock className="w-4 h-4 text-indigo-400" />
                                    <span>碼錶：{formatTime(secondsElapsed)}</span>
                                    <button 
                                        onClick={() => setIsTimerRunning(!isTimerRunning)}
                                        className={`px-2 py-0.5 rounded ${isTimerRunning ? 'bg-amber-600' : 'bg-emerald-600'} text-white font-bold`}
                                    >
                                        {isTimerRunning ? '暫停' : '開始'}
                                    </button>
                                    <button onClick={() => setSecondsElapsed(0)} className="text-slate-400 hover:text-white">重置</button>
                                </div>
                                <button 
                                    onClick={() => setShowSyncModal(true)}
                                    className="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-1.5 transition shadow"
                                >
                                    <Cloud className="w-4 h-4" /> 雲端同步設定
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* 主內容區 */}
                    <main className="max-w-6xl mx-auto px-4 mt-6">
                        {activeTab === 'daily' ? (
                            /* =================== 視角一：今日跨書工作台 =================== */
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                                            <Calendar className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-800">今日閱讀日誌與跨書對讀</h2>
                                            <p className="text-sm text-slate-500">一天看多本書？在這裡同時並排推進各書當日章節。</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <label className="text-sm font-medium text-slate-600">選擇工作日期：</label>
                                        <input 
                                            type="date" 
                                            value={todayDate}
                                            onChange={(e) => setTodayDate(e.target.value)}
                                            className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                </div>

                                {/* 今日跨書並排列表 */}
                                <div className="space-y-6">
                                    {todaysReadings.length === 0 ? (
                                        <div className="bg-white p-12 rounded-2xl text-center border border-dashed border-slate-300">
                                            <BookOpen className="w-12 h-12 text-slate-400 mx-auto mb-3" />
                                            <h3 className="text-lg font-bold text-slate-700">今日尚無綁定閱讀此日期的章節</h3>
                                            <p className="text-sm text-slate-500 mt-1 mb-4">你可以到右上方切換至「單書完整脈絡」挑選書籍，並將章節的「閱讀日期」設定為今天（{todayDate}）。</p>
                                            <button 
                                                onClick={() => setActiveTab('books')}
                                                className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium shadow hover:bg-indigo-500 transition"
                                            >
                                                前往單書脈絡新增／編輯章節
                                            </button>
                                        </div>
                                    ) : (
                                        todaysReadings.map(book => (
                                            <div key={book.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                                <div className="bg-slate-800 text-white px-6 py-3 flex justify-between items-center">
                                                    <div className="flex items-center gap-2">
                                                        <span className="bg-indigo-500 text-xs px-2.5 py-1 rounded-full font-bold">{book.author}</span>
                                                        <h3 className="font-bold text-lg">{book.title}</h3>
                                                    </div>
                                                    <button 
                                                        onClick={() => { setSelectedBookId(book.id); setActiveTab('books'); }}
                                                        className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition"
                                                    >
                                                        前往單書詳情 ➔
                                                    </button>
                                                </div>

                                                <div className="p-6 space-y-6">
                                                    {book.activeChapters.map(ch => (
                                                        <div key={ch.id} className="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                                                            <div className="flex justify-between items-center">
                                                                <h4 className="font-bold text-slate-800 flex items-center gap-2">
                                                                    <span className="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                                                                    {ch.title}
                                                                </h4>
                                                                <span className="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-lg font-medium">
                                                                    耗時：{ch.durationMinutes} 分鐘
                                                                </span>
                                                            </div>

                                                            {/* 卡片對照清單 */}
                                                            <div className="space-y-4">
                                                                {ch.notes.map((note, nIdx) => (
                                                                    <div key={note.id} className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                                                                        {/* 左欄：原句 */}
                                                                        <div className="bg-amber-50/60 p-4 rounded-lg border border-amber-200/60 flex flex-col justify-between">
                                                                            <div>
                                                                                <div className="text-xs font-bold text-amber-800 mb-1 flex items-center justify-between">
                                                                                    <span>📌 觸動原句 #{nIdx + 1}</span>
                                                                                    <span className="text-[10px] text-slate-400">{note.timestamp}</span>
                                                                                </div>
                                                                                <textarea 
                                                                                    value={note.quote}
                                                                                    onChange={(e) => {
                                                                                        const val = e.target.value;
                                                                                        setBooks(books.map(b => b.id === book.id ? {
                                                                                            ...b,
                                                                                            chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                ...c,
                                                                                                notes: c.notes.map(n => n.id === note.id ? { ...n, quote: val } : n)
                                                                                            } : c)
                                                                                        } : b));
                                                                                    }}
                                                                                    className="w-full bg-transparent text-sm text-slate-800 focus:outline-none resize-none"
                                                                                    rows="3"
                                                                                    placeholder="輸入有感觸的原文..."
                                                                                />
                                                                            </div>
                                                                        </div>

                                                                        {/* 右欄：我的輸出 */}
                                                                        <div className="bg-indigo-50/40 p-4 rounded-lg border border-indigo-100 flex flex-col justify-between space-y-3">
                                                                            <div>
                                                                                <div className="text-xs font-bold text-indigo-900 mb-1">💡 我的話語輸出（內化轉譯）</div>
                                                                                <textarea 
                                                                                    value={note.output}
                                                                                    onChange={(e) => {
                                                                                        const val = e.target.value;
                                                                                        setBooks(books.map(b => b.id === book.id ? {
                                                                                            ...b,
                                                                                            chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                ...c,
                                                                                                notes: c.notes.map(n => n.id === note.id ? { ...n, output: val } : n)
                                                                                            } : c)
                                                                                        } : b));
                                                                                    }}
                                                                                    className="w-full bg-transparent text-sm text-slate-800 focus:outline-none resize-none"
                                                                                    rows="3"
                                                                                    placeholder="用自己的話重述這句話，或寫下為什麼打中你..."
                                                                                />
                                                                            </div>
                                                                            <div className="pt-2 border-t border-indigo-100 flex items-center gap-2">
                                                                                <span className="text-xs font-bold text-indigo-700">⚡ 微行動：</span>
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={note.action}
                                                                                    onChange={(e) => {
                                                                                        const val = e.target.value;
                                                                                        setBooks(books.map(b => b.id === book.id ? {
                                                                                            ...b,
                                                                                            chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                ...c,
                                                                                                notes: c.notes.map(n => n.id === note.id ? { ...n, action: val } : n)
                                                                                            } : c)
                                                                                        } : b));
                                                                                    }}
                                                                                    placeholder="明天可以立刻嘗試的小行動..."
                                                                                    className="w-full text-xs bg-transparent focus:outline-none text-slate-700"
                                                                                />
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* =================== 視角二：單書完整脈絡檢視 =================== */
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                {/* 左側：書櫃列表側邊欄 */}
                                <div className="lg:col-span-1 space-y-4">
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                                <BookOpen className="w-4 h-4 text-indigo-600" /> 我的書櫃
                                            </h3>
                                            <button 
                                                onClick={handleAddBook}
                                                className="bg-indigo-600 hover:bg-indigo-500 text-white p-1.5 rounded-lg text-xs font-medium flex items-center gap-1 transition"
                                            >
                                                <Plus className="w-4 h-4" /> 新增書籍
                                            </button>
                                        </div>
                                        <div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">
                                            {books.map(book => (
                                                <div 
                                                    key={book.id}
                                                    onClick={() => setSelectedBookId(book.id)}
                                                    className={`p-3 rounded-xl cursor-pointer transition border ${book.id === selectedBookId ? 'bg-indigo-50 border-indigo-300 shadow-xs' : 'bg-white border-slate-100 hover:bg-slate-50'}`}
                                                >
                                                    <h4 className="font-bold text-sm text-slate-800 truncate">{book.title}</h4>
                                                    <div className="flex justify-between items-center mt-1">
                                                        <span className="text-xs text-slate-500">{book.author}</span>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${book.status === 'completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                            {book.status === 'completed' ? '已完讀' : '閱讀中'}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* 右側：單書完整脈絡與逐章節編輯區 */}
                                <div className="lg:col-span-3 space-y-6">
                                    {currentBook && (
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                                            {/* 書籍頂部標題與屬性 */}
                                            <div className="border-b border-slate-100 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                <div className="space-y-2 flex-1">
                                                    <div className="flex items-center gap-3">
                                                        <input 
                                                            type="text" 
                                                            value={currentBook.title}
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                setBooks(books.map(b => b.id === currentBook.id ? { ...b, title: val } : b));
                                                            }}
                                                            className="text-2xl font-bold text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full"
                                                        />
                                                    </div>
                                                    <div className="flex items-center gap-3 text-sm text-slate-500">
                                                        <span>作者：</span>
                                                        <input 
                                                            type="text" 
                                                            value={currentBook.author}
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                setBooks(books.map(b => b.id === currentBook.id ? { ...b, author: val } : b));
                                                            }}
                                                            className="bg-slate-50 px-2 py-1 rounded border border-slate-200 text-slate-700 font-medium"
                                                        />
                                                        <span>狀態：</span>
                                                        <select 
                                                            value={currentBook.status}
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                setBooks(books.map(b => b.id === currentBook.id ? { ...b, status: val } : b));
                                                            }}
                                                            className="bg-slate-50 px-2 py-1 rounded border border-slate-200 text-slate-700 font-medium text-xs"
                                                        >
                                                            <option value="reading">閱讀推進中</option>
                                                            <option value="completed">已完讀</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-2">
                                                    <button 
                                                        onClick={() => setHideQuotes(!hideQuotes)}
                                                        className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition ${hideQuotes ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                                    >
                                                        {hideQuotes ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                                                        {hideQuotes ? '內化檢測中（隱藏原句）' : '檢測模式'}
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            if (confirm('確定要刪除這本書嗎？')) {
                                                                setBooks(books.filter(b => b.id !== currentBook.id));
                                                                setSelectedBookId(books[0]?.id || '');
                                                            }
                                                        }}
                                                        className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg transition"
                                                        title="刪除此書"
                                                    >
                                                        <Trash2 className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </div>

                                            {/* 閱讀目的與標籤 */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-1.5">
                                                    <label className="text-xs font-bold text-slate-600 flex items-center gap-1">
                                                        🎯 閱讀目的（核心提問）
                                                    </label>
                                                    <textarea 
                                                        value={currentBook.purpose}
                                                        onChange={(e) => {
                                                            const val = e.target.value;
                                                            setBooks(books.map(b => b.id === currentBook.id ? { ...b, purpose: val } : b));
                                                        }}
                                                        rows="2"
                                                        className="w-full bg-white p-2 rounded border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                    />
                                                </div>
                                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                                                    <label className="text-xs font-bold text-slate-600">📅 閱讀日期起訖與統計</label>
                                                    <div className="flex items-center gap-2 text-xs">
                                                        <span>開始：</span>
                                                        <input 
                                                            type="date" 
                                                            value={currentBook.startDate}
                                                            onChange={(e) => setBooks(books.map(b => b.id === currentBook.id ? { ...b, startDate: e.target.value } : b))}
                                                            className="bg-white p-1.5 rounded border border-slate-200"
                                                        />
                                                        <span>完讀：</span>
                                                        <input 
                                                            type="date" 
                                                            value={currentBook.endDate}
                                                            onChange={(e) => setBooks(books.map(b => b.id === currentBook.id ? { ...b, endDate: e.target.value } : b))}
                                                            className="bg-white p-1.5 rounded border border-slate-200"
                                                        />
                                                    </div>
                                                    <div className="text-xs text-slate-500 pt-1">
                                                        累積總耗時：
                                                        <span className="font-bold text-indigo-600">
                                                            {currentBook.chapters.reduce((acc, c) => acc + (Number(c.durationMinutes) || 0), 0)} 分鐘
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 逐章節流水線區塊 */}
                                            <div className="space-y-6 pt-4 border-t border-slate-100">
                                                <div className="flex justify-between items-center">
                                                    <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                                        📖 逐章節筆記流水線
                                                    </h3>
                                                    <button 
                                                        onClick={() => {
                                                            const newCh = {
                                                                id: 'ch-' + Date.now(),
                                                                title: `Ch.${currentBook.chapters.length + 1} 新章節`,
                                                                readDate: new Date().toISOString().split('T')[0],
                                                                durationMinutes: 30,
                                                                notes: [
                                                                    {
                                                                        id: 'note-' + Date.now(),
                                                                        quote: '輸入觸動原句...',
                                                                        output: '輸入我的話語輸出...',
                                                                        action: '微行動...',
                                                                        timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16)
                                                                    }
                                                                ]
                                                            };
                                                            setBooks(books.map(b => b.id === currentBook.id ? { ...b, chapters: [...b.chapters, newCh] } : b));
                                                        }}
                                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1 transition shadow"
                                                    >
                                                        <Plus className="w-4 h-4" /> 新增章節
                                                    </button>
                                                </div>

                                                <div className="space-y-6">
                                                    {currentBook.chapters.map((ch, cIdx) => (
                                                        <div key={ch.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-4 shadow-2xs">
                                                            {/* 章節標題與設定 */}
                                                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-3 border-b border-slate-200">
                                                                <div className="flex items-center gap-2 w-full md:w-auto flex-1">
                                                                    <span className="bg-indigo-600 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">
                                                                        {cIdx + 1}
                                                                    </span>
                                                                    <input 
                                                                        type="text" 
                                                                        value={ch.title}
                                                                        onChange={(e) => {
                                                                            const val = e.target.value;
                                                                            setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                ...b,
                                                                                chapters: b.chapters.map(c => c.id === ch.id ? { ...c, title: val } : c)
                                                                            } : b));
                                                                        }}
                                                                        className="font-bold text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none flex-1"
                                                                    />
                                                                </div>
                                                                <div className="flex items-center gap-3 text-xs">
                                                                    <div className="flex items-center gap-1">
                                                                        <span>閱讀日期：</span>
                                                                        <input 
                                                                            type="date" 
                                                                            value={ch.readDate}
                                                                            onChange={(e) => {
                                                                                const val = e.target.value;
                                                                                setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                    ...b,
                                                                                    chapters: b.chapters.map(c => c.id === ch.id ? { ...c, readDate: val } : c)
                                                                                } : b));
                                                                            }}
                                                                            className="bg-white px-2 py-1 rounded border border-slate-200"
                                                                        />
                                                                    </div>
                                                                    <div className="flex items-center gap-1">
                                                                        <span>耗時(分)：</span>
                                                                        <input 
                                                                            type="number" 
                                                                            value={ch.durationMinutes}
                                                                            onChange={(e) => {
                                                                                const val = e.target.value;
                                                                                setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                    ...b,
                                                                                    chapters: b.chapters.map(c => c.id === ch.id ? { ...c, durationMinutes: val } : c)
                                                                                } : b));
                                                                            }}
                                                                            className="w-16 bg-white px-2 py-1 rounded border border-slate-200 text-center"
                                                                        />
                                                                    </div>
                                                                    <button 
                                                                        onClick={() => {
                                                                            setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                ...b,
                                                                                chapters: b.chapters.filter(c => c.id !== ch.id)
                                                                            } : b));
                                                                        }}
                                                                        className="text-rose-500 hover:text-rose-700 p-1"
                                                                        title="刪除此章節"
                                                                    >
                                                                        <Trash2 className="w-4 h-4" />
                                                                    </button>
                                                                </div>
                                                            </div>

                                                            {/* 該章節底下的卡片列表 */}
                                                            <div className="space-y-4">
                                                                {ch.notes.map((note, nIdx) => (
                                                                    <div key={note.id} className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-slate-200 relative group">
                                                                        {/* 左欄：原句 */}
                                                                        <div className="bg-amber-50/60 p-4 rounded-lg border border-amber-200/60 flex flex-col justify-between">
                                                                            <div>
                                                                                <div className="text-xs font-bold text-amber-800 mb-1 flex items-center justify-between">
                                                                                    <span>📌 原文金句 #{nIdx + 1}</span>
                                                                                    <span className="text-[10px] text-slate-400">{note.timestamp}</span>
                                                                                </div>
                                                                                <textarea 
                                                                                    value={note.quote}
                                                                                    onChange={(e) => {
                                                                                        const val = e.target.value;
                                                                                        setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                            ...b,
                                                                                            chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                ...c,
                                                                                                notes: c.notes.map(n => n.id === note.id ? { ...n, quote: val } : n)
                                                                                            } : c)
                                                                                        } : b));
                                                                                    }}
                                                                                    className={`w-full bg-transparent text-sm text-slate-800 focus:outline-none resize-none transition ${hideQuotes ? 'blur-sm hover:blur-none select-none' : ''}`}
                                                                                    rows="3"
                                                                                    placeholder="輸入有感觸的原文..."
                                                                                />
                                                                            </div>
                                                                        </div>

                                                                        {/* 右欄：我的輸出 */}
                                                                        <div className="bg-indigo-50/40 p-4 rounded-lg border border-indigo-100 flex flex-col justify-between space-y-3">
                                                                            <div>
                                                                                <div className="text-xs font-bold text-indigo-900 mb-1">💡 我的話語輸出（內化轉譯）</div>
                                                                                <textarea 
                                                                                    value={note.output}
                                                                                    onChange={(e) => {
                                                                                        const val = e.target.value;
                                                                                        setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                            ...b,
                                                                                            chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                ...c,
                                                                                                notes: c.notes.map(n => n.id === note.id ? { ...n, output: val } : n)
                                                                                            } : c)
                                                                                        } : b));
                                                                                    }}
                                                                                    className="w-full bg-transparent text-sm text-slate-800 focus:outline-none resize-none"
                                                                                    rows="3"
                                                                                    placeholder="用自己的話重述這句話..."
                                                                                />
                                                                            </div>
                                                                            <div className="pt-2 border-t border-indigo-100 flex items-center justify-between gap-2">
                                                                                <div className="flex items-center gap-1.5 flex-1">
                                                                                    <span className="text-xs font-bold text-indigo-700">⚡ 行動：</span>
                                                                                    <input 
                                                                                        type="text" 
                                                                                        value={note.action}
                                                                                        onChange={(e) => {
                                                                                            const val = e.target.value;
                                                                                            setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                                ...b,
                                                                                                chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                    ...c,
                                                                                                    notes: c.notes.map(n => n.id === note.id ? { ...n, action: val } : n)
                                                                                                } : c)
                                                                                            } : b));
                                                                                        }}
                                                                                        placeholder="明天可嘗試的小行動..."
                                                                                        className="w-full text-xs bg-transparent focus:outline-none text-slate-700"
                                                                                    />
                                                                                </div>
                                                                                <button 
                                                                                    onClick={() => {
                                                                                        setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                            ...b,
                                                                                            chapters: b.chapters.map(c => c.id === ch.id ? {
                                                                                                ...c,
                                                                                                notes: c.notes.filter(n => n.id !== note.id)
                                                                                            } : c)
                                                                                        } : b));
                                                                                    }}
                                                                                    className="text-slate-400 hover:text-rose-500 p-1 transition"
                                                                                    title="刪除此筆記卡片"
                                                                                >
                                                                                    <Trash2 className="w-3.5 h-3.5" />
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                ))}

                                                                <button 
                                                                    onClick={() => {
                                                                        const newNote = {
                                                                            id: 'note-' + Date.now(),
                                                                            quote: '新觸動原句...',
                                                                            output: '新個人輸出...',
                                                                            action: '新微行動...',
                                                                            timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16)
                                                                        };
                                                                        setBooks(books.map(b => b.id === currentBook.id ? {
                                                                            ...b,
                                                                            chapters: b.chapters.map(c => c.id === ch.id ? { ...c, notes: [...c.notes, newNote] } : c)
                                                                        } : b));
                                                                    }}
                                                                    className="w-full py-2 bg-white border border-dashed border-slate-300 hover:border-indigo-400 hover:text-indigo-600 rounded-xl text-xs font-medium text-slate-500 transition flex items-center justify-center gap-1"
                                                                >
                                                                    <Plus className="w-3.5 h-3.5" /> 在本章新增一則金句與輸出
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* 全書總結與三次重讀打卡 */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-slate-100">
                                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
                                                    <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                                        ✍️ 全書核心心得分享 (Synthesis)
                                                    </h4>
                                                    <textarea 
                                                        value={currentBook.synthesis}
                                                        onChange={(e) => {
                                                            const val = e.target.value;
                                                            setBooks(books.map(b => b.id === currentBook.id ? { ...b, synthesis: val } : b));
                                                        }}
                                                        rows="4"
                                                        placeholder="統整這本書帶給你的最大觀點轉變與收穫..."
                                                        className="w-full bg-white p-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                    />
                                                </div>

                                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
                                                    <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                                        🔄 間隔重讀打卡（對抗遺忘曲線）
                                                    </h4>
                                                    <div className="space-y-2">
                                                        {currentBook.reviews.map((rev, rIdx) => (
                                                            <div key={rIdx} className="flex items-center justify-between bg-white p-2.5 rounded-xl border border-slate-200">
                                                                <div className="flex items-center gap-2 text-xs font-medium">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={rev.done}
                                                                        onChange={(e) => {
                                                                            const checked = e.target.checked;
                                                                            const dateStr = checked ? new Date().toISOString().split('T')[0] : '';
                                                                            setBooks(books.map(b => b.id === currentBook.id ? {
                                                                                ...b,
                                                                                reviews: b.reviews.map((r, i) => i === rIdx ? { ...r, done: checked, date: dateStr } : r)
                                                                            } : b));
                                                                        }}
                                                                        className="w-4 h-4 text-indigo-600 rounded"
                                                                    />
                                                                    <span>重讀筆記（第 {rev.times} 次）</span>
                                                                </div>
                                                                <input 
                                                                    type="date" 
                                                                    value={rev.date}
                                                                    onChange={(e) => {
                                                                        const val = e.target.value;
                                                                        setBooks(books.map(b => b.id === currentBook.id ? {
                                                                            ...b,
                                                                            reviews: b.reviews.map((r, i) => i === rIdx ? { ...r, date: val } : r)
                                                                        } : b));
                                                                    }}
                                                                    className="text-xs bg-slate-50 p-1 rounded border border-slate-200"
                                                                />
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 雲端同步設定 Modal */}
                    {showSyncModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-xl border border-slate-200">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                        <Cloud className="w-5 h-5 text-indigo-600" /> GitHub Gist 跨裝置雲端同步
                                    </h3>
                                    <button onClick={() => setShowSyncModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                                </div>

                                <p className="text-xs text-slate-600 leading-relaxed">
                                    利用你自己的 GitHub 帳號作為免費私密雲端資料庫。只需設定一次，手機與電腦即可無縫同步讀書筆記！
                                </p>

                                <div className="space-y-4">
                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-700">1. GitHub Personal Access Token (PAT)</label>
                                        <input 
                                            type="password" 
                                            value={githubToken}
                                            onChange={(e) => setGithubToken(e.target.value)}
                                            placeholder="請貼上 ghp_... 開頭的 Token"
                                            className="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                                        />
                                        <p className="text-[11px] text-slate-400">去 GitHub 設定頁面 Settings ➔ Developer settings ➔ Personal access tokens (classic) 產出，勾選 gist 權限即可。</p>
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-xs font-bold text-slate-700">2. Gist ID（若第一次同步可留空自動建立）</label>
                                        <input 
                                            type="text" 
                                            value={gistId}
                                            onChange={(e) => setGistId(e.target.value)}
                                            placeholder="例如：a1b2c3d4e5f6..."
                                            className="w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                                        />
                                    </div>

                                    {syncStatus && (
                                        <div className="p-3 bg-slate-100 rounded-xl text-xs font-medium text-slate-800 text-center">
                                            {syncStatus}
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-3 pt-2">
                                        <button 
                                            onClick={handleSyncToGist}
                                            className="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-bold shadow transition flex items-center justify-center gap-1.5"
                                        >
                                            <Upload className="w-4 h-4" /> 同步至雲端
                                        </button>
                                        <button 
                                            onClick={handleFetchFromGist}
                                            className="bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-sm font-bold shadow transition flex items-center justify-center gap-1.5"
                                        >
                                            <RefreshCw className="w-4 h-4" /> 從雲端載入
                                        </button>
                                    </div>
                                </div>

                                <div className="border-t border-slate-100 pt-4 flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={handleExportJSON}
                                            className="text-xs text-indigo-600 hover:underline flex items-center gap-1 font-medium"
                                        >
                                            <Download className="w-3.5 h-3.5" /> 備份下載 JSON
                                        </button>
                                        <label className="text-xs text-indigo-600 hover:underline flex items-center gap-1 font-medium cursor-pointer">
                                            <Upload className="w-3.5 h-3.5" /> 匯入 JSON
                                            <input type="file" onChange={handleImportJSON} className="hidden" accept=".json" />
                                        </label>
                                    </div>
                                    <button 
                                        onClick={() => setShowSyncModal(false)}
                                        className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition"
                                    >
                                        關閉
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
