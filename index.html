      // 預設每日跨書思維碰撞筆記 (依日期儲存)
      const SAMPLE_DAILY_SPARKS = {
        '2026-11-04':
          '💡 今日雙書碰撞（《卡片盒筆記》Ch.3 ✕ 《創意黏力學》Ch.2）：\n早上讀《卡片盒筆記》提到「做筆記不要問它屬於哪個分類，要問它在什麼情境下能解決什麼問題」；晚上讀《創意黏力學》剛好講到「要吸引人注意，必須先製造知識缺口（提問）」。\n👉 結合應用：我以後在寫每章的「我的話語輸出」時，都可以試著先寫一個「這段觀點能解決什麼反直覺的問題？」，這樣我的筆記未來直接就能當作簡報開場的破題素材！',

      };

      const STORAGE_KEY_BOOKS = 'reading_notes_multibook_v3_books';
      const STORAGE_KEY_SPARKS = 'reading_notes_multibook_v3_sparks';

      // 日期與時間工具函式
      const getTodayDateStr = () => '2026-11-04'; // 預設對應當前日期 2026-11-04
      const getNowTimeStr = () => {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      };

      const formatMinutes = (totalMins) => {
        const mins = Number(totalMins) || 0;
        if (mins <= 0) return '0 分鐘';
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (h === 0) return `${m} 分鐘`;
        if (m === 0) return `${h} 小時`;
        return `${h} 小時 ${m} 分`;
      };

      function App() {
        // 1. 書籍與章節資料庫狀態
        const [books, setBooks] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY_BOOKS);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (e) {
            console.error('Failed to load books:', e);
          }
          return SAMPLE_BOOKS;
        });

        // 2. 每日跨書思維碰撞筆記狀態 (依 YYYY-MM-DD 索引)
        const [dailySparks, setDailySparks] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY_SPARKS);
            if (saved) return JSON.parse(saved);
          } catch (e) {
            console.error('Failed to load daily sparks:', e);
          }
          return SAMPLE_DAILY_SPARKS;
        });

        // 3. 核心檢視模式切換：'daily' (今日跨書工作台 - 解決一天讀 2+ 本書) | 'book' (單書完整脈絡檢視)
        const [viewMode, setViewMode] = useState('daily');
        const [selectedDate, setSelectedDate] = useState('2026-11-04');
        const [dailyLayout, setDailyLayout] = useState('grid'); // 'grid' (雙欄並排對讀) | 'stack' (上下流式展開)

        // 單書檢視下的當前選中書籍與章節篩選
        const [activeBookId, setActiveBookId] = useState(() => books[0]?.id || 'book-1');
        const [selectedChapterId, setSelectedChapterId] = useState('all');

        // 通用 UI 狀態
        const [focusMode, setFocusMode] = useState('split'); // 'split' (對照模式) | 'outputOnly' (內化檢測：只看我的輸出)
        const [searchQuery, setSearchQuery] = useState('');
        const [newTagInput, setNewTagInput] = useState('');
        const [toastMessage, setToastMessage] = useState(null);
        const [showMarkdownModal, setShowMarkdownModal] = useState(false);
        const [exportType, setExportType] = useState('daily'); // 'daily' | 'book'
        const [confirmDeleteId, setConfirmDeleteId] = useState(null);

        // 「+ 新增今日閱讀章節」快速表單狀態
        const [showAddTodayChapter, setShowAddTodayChapter] = useState(false);
        const [quickChapterForm, setQuickChapterForm] = useState({
          bookId: books[0]?.id || 'book-1',
          isNewBook: false,
          newBookTitle: '',
          newBookAuthor: '',
          chapterTitle: '',
          durationMinutes: 30,
          timeSlot: '21:00 - 21:30',
          pageRange: 'p.'
        });

        // 頂部智慧計時碼錶（可直接綁定正在讀哪一本書的哪一個章節）
        const [timerRunning, setTimerRunning] = useState(false);
        const [timerSeconds, setTimerSeconds] = useState(0);
        const [timerTarget, setTimerTarget] = useState({
          bookId: 'book-1',
          chapterId: 'ch-102'
        });

        // 自動儲存至 localStorage
        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY_BOOKS, JSON.stringify(books));
          } catch (e) {
            console.error('Failed to save books:', e);
          }
        }, [books]);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY_SPARKS, JSON.stringify(dailySparks));
          } catch (e) {
            console.error('Failed to save sparks:', e);
          }
        }, [dailySparks]);

        // 計時器每秒推進
        useEffect(() => {
          if (!timerRunning) return;
          const interval = setInterval(() => {
            setTimerSeconds((prev) => prev + 1);
          }, 1000);
          return () => clearInterval(interval);
        }, [timerRunning]);

        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => {
            setToastMessage((prev) => (prev === msg ? null : prev));
          }, 3200);
        };

        // 取得當前選中書籍物件（單書視角用）
        const activeBook = useMemo(() => {
          return books.find((b) => b.id === activeBookId) || books[0];
        }, [books, activeBookId]);

        // 收集所有曾經有閱讀紀錄的日期清單（供日期快速切換列使用）
        const allLoggedDates = useMemo(() => {
          const dateMap = new Map();
          books.forEach((book) => {
            (book.chapters || []).forEach((ch) => {
              if (ch.readDate) {
                const prev = dateMap.get(ch.readDate) || { count: 0, mins: 0, bookTitles: new Set() };
                prev.count += 1;
                prev.mins += Number(ch.durationMinutes) || 0;
                prev.bookTitles.add(book.title);
                dateMap.set(ch.readDate, prev);
              }
            });
          });
          // 確保當前選中日期也在清單內
          if (!dateMap.has(selectedDate)) {
            dateMap.set(selectedDate, { count: 0, mins: 0, bookTitles: new Set() });
          }
          return Array.from(dateMap.entries())
            .map(([date, info]) => ({
              date,
              chapterCount: info.count,
              bookCount: info.bookTitles.size,
              totalMins: info.mins
            }))
            .sort((a, b) => b.date.localeCompare(a.date));
        }, [books, selectedDate]);

        // 計算「選中日期 (selectedDate)」當天的所有跨書章節清單
        const dailyChaptersList = useMemo(() => {
          const list = [];
          books.forEach((book) => {
            (book.chapters || []).forEach((ch, idx) => {
              if (ch.readDate === selectedDate) {
                list.push({
                  bookId: book.id,
                  bookTitle: book.title,
                  bookAuthor: book.author,
                  bookTheme: book.theme || 'emerald',
                  bookSerialNo: book.serialNo,
                  chapterIndex: idx + 1,
                  chapter: ch
                });
              }
            });
          });
          return list;
        }, [books, selectedDate]);

        // 計算「選中日期」當天的統計指標
        const dailyStats = useMemo(() => {
          const uniqueBooks = new Set(dailyChaptersList.map((item) => item.bookId));
          let totalMins = 0;
          let totalQuotes = 0;
          let totalOutputs = 0;
          let totalActions = 0;

          dailyChaptersList.forEach(({ chapter }) => {
            totalMins += Number(chapter.durationMinutes) || 0;
            (chapter.notes || []).forEach((n) => {
              if (n.quote?.trim()) totalQuotes++;
              if (n.paraphrase?.trim()) totalOutputs++;
              if (n.actionText?.trim()) totalActions++;
            });
          });

          return {
            booksCount: uniqueBooks.size,
            chaptersCount: dailyChaptersList.length,
            totalMins,
            totalQuotes,
            totalOutputs,
            totalActions
          };
        }, [dailyChaptersList]);

        // 通用：更新特定書籍的資料
        const updateBookById = (targetBookId, updater) => {
          setBooks((prevBooks) =>
            prevBooks.map((book) => {
              if (book.id !== targetBookId) return book;
              return typeof updater === 'function' ? updater(book) : { ...book, ...updater };
            })
          );
        };

        // 通用：更新特定書籍下的特定章節（在「今日跨書工作台」與「單書檢視」完全共用同步！）
        const handleUpdateChapter = (bookId, chapterId, field, value) => {
          updateBookById(bookId, (b) => ({
            ...b,
            chapters: b.chapters.map((ch) =>
              ch.id === chapterId ? { ...ch, [field]: value } : ch
            )
          }));
        };

        // 通用：更新特定章節下的筆記卡（感觸金句 / 我的話語輸出 / 觸發行動）
        const handleUpdateNoteCard = (bookId, chapterId, noteId, field, value) => {
          updateBookById(bookId, (b) => ({
            ...b,
            chapters: b.chapters.map((ch) => {
              if (ch.id !== chapterId) return ch;
              return {
                ...ch,
                notes: ch.notes.map((n) =>
                  n.id === noteId ? { ...n, [field]: value } : n
                )
              };
            })
          }));
        };

        // 通用：在特定書籍的章節內新增一張「感觸金句 ➔ 我的話語輸出」卡片
        const handleAddNoteCard = (bookId, chapterId, defaultDateStr) => {
          const recordDate = defaultDateStr || selectedDate || getTodayDateStr();
          const newNote = {
            id: `note-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            page: 'p.',
            recordedAt: `${recordDate} ${getNowTimeStr()}`,
            quote: '',
            paraphrase: '',
            actionText: '',
            actionDone: false,
            practiceLog: ''
          };
          updateBookById(bookId, (b) => ({
            ...b,
            chapters: b.chapters.map((ch) =>
              ch.id === chapterId
                ? { ...ch, isCollapsed: false, notes: [...ch.notes, newNote] }
                : ch
            )
          }));
        };

        // 通用：刪除筆記卡
        const handleDeleteNoteCard = (bookId, chapterId, noteId) => {
          updateBookById(bookId, (b) => ({
            ...b,
            chapters: b.chapters.map((ch) => {
              if (ch.id !== chapterId) return ch;
              if (ch.notes.length <= 1) {
                showToast('每個章節至少保留一張轉化卡，可直接修改內容');
                return ch;
              }
              return {
                ...ch,
                notes: ch.notes.filter((n) => n.id !== noteId)
              };
            })
          }));
        };

        // 通用：刪除章節
        const handleDeleteChapter = (bookId, chapterId) => {
          const targetBook = books.find((b) => b.id === bookId);
          if (targetBook && targetBook.chapters.length <= 1) {
            showToast('每本書至少需保留一個章節區塊');

            ...b,
            chapters: b.chapters.filter((ch) => ch.id !== chapterId)
          }));

        // 在「今日跨書工作台」快速新增今日讀的某本書章節

              id: newId,

              status: 'reading',
              startDate: selectedDate,
              endDate: '',
              tags: ['平行閱讀'],
              purpose: '',
              chapters: [
                {

                  timeSlot: quickChapterForm.timeSlot || `${getNowTimeStr()}`,

        // 單書視角：新增一本書
        const handleAddBookInSingleView = () => {

        const handleAddChapterInSingleView = () => {

        const handleDeleteBook = (bookId) => {

          showToast('已刪除該本書籍筆記');

        // 計時器：啟動指定書籍與章節的計時
        const handleStartChapterTimer = (bookId, chapterId, bookTitle, chapterTitle) => {
          setTimerTarget({ bookId, chapterId });
          setTimerRunning(true);
          showToast(`⏱️ 開始計時：《${bookTitle}》— ${chapterTitle}`);
        };

        // 計時器：完成並將分鐘數直接累加進該章節
        const handleApplyTimerToChapter = () => {
          setTimerRunning(false);
          const addedMins = Math.max(1, Math.round(timerSeconds / 60));
          const targetBook = books.find((b) => b.id === timerTarget.bookId);
          const targetCh = targetBook?.chapters.find((c) => c.id === timerTarget.chapterId);

          if (targetBook && targetCh) {
            handleUpdateChapter(
              targetBook.id,
              targetCh.id,
              'durationMinutes',
              (Number(targetCh.durationMinutes) || 0) + addedMins
            );
            showToast(`已將 ${addedMins} 分鐘計入《${targetBook.title}》「${targetCh.title}」！`);
          } else {
            showToast(`計時結束（共 ${addedMins} 分鐘）`);
          }
          setTimerSeconds(0);
        };

        const formatTimerDisplay = (secs) => {
          const m = String(Math.floor(secs / 60)).padStart(2, '0');
          const s = String(secs % 60).padStart(2, '0');
          return `${m}:${s}`;
        };

        // 單書統計指標計算
        const singleBookStats = useMemo(() => {
          let totalQuotes = 0;
          let totalParaphrases = 0;
          let totalMinutes = 0;
          const uniqueDates = new Set();
          const aggregatedActions = [];

          if (activeBook.startDate) uniqueDates.add(activeBook.startDate);
          if (activeBook.endDate) uniqueDates.add(activeBook.endDate);

          (activeBook.chapters || []).forEach((ch) => {
            totalMinutes += Number(ch.durationMinutes) || 0;
            if (ch.readDate) uniqueDates.add(ch.readDate);
            (ch.notes || []).forEach((n) => {
              if (n.quote?.trim()) totalQuotes++;
              if (n.paraphrase?.trim()) totalParaphrases++;
              if (n.actionText?.trim()) {
                aggregatedActions.push({
                  chapterId: ch.id,
                  chapterTitle: ch.title,
                  chapterDate: ch.readDate,
                  noteId: n.id,
                  page: n.page,
                  actionText: n.actionText,
                  actionDone: n.actionDone,
                  practiceLog: n.practiceLog
                });
              }
            });
          });

          let spanDays = 1;
          if (activeBook.startDate) {
            const start = new Date(activeBook.startDate);
            const end = activeBook.endDate ? new Date(activeBook.endDate) : new Date('2026-11-04');
            const diffDays = Math.floor((end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24)) + 1;
            spanDays = Math.max(1, diffDays);
          }

          return {
            totalQuotes,
            totalParaphrases,
            totalMinutes,
            activeDaysCount: uniqueDates.size,
            spanDays,
            aggregatedActions,
            completedActions: aggregatedActions.filter((a) => a.actionDone).length,
            completedRereads: (activeBook.rereads || []).filter((r) => r.completed).length
          };
        }, [activeBook]);

        // 單書檢視下的章節過濾
        const filteredSingleBookChapters = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          return (activeBook.chapters || [])
            .filter((ch) => selectedChapterId === 'all' || ch.id === selectedChapterId)
            .map((ch) => {
              if (!q) return ch;
              const matchedNotes = ch.notes.filter(
                (n) =>
                  n.quote.toLowerCase().includes(q) ||
                  n.paraphrase.toLowerCase().includes(q) ||
                  n.actionText.toLowerCase().includes(q) ||
                  ch.title.toLowerCase().includes(q)
              );
              return { ...ch, notes: matchedNotes };
            })
            .filter((ch) => !q || ch.notes.length > 0);
        }, [activeBook.chapters, selectedChapterId, searchQuery]);

        // 標籤與重讀更新（單書視角）
        const handleAddTag = (e) => {
          e.preventDefault();
          const trimmed = newTagInput.trim();
          if (!trimmed) return;
          if (!activeBook.tags.includes(trimmed)) {
            updateBookById(activeBook.id, (b) => ({ ...b, tags: [...b.tags, trimmed] }));
          }
          setNewTagInput('');
        };

        const handleRemoveTag = (tagToRemove) => {
          updateBookById(activeBook.id, (b) => ({
            ...b,
            tags: b.tags.filter((t) => t !== tagToRemove)
          }));
        };

        const handleUpdateReread = (stage, field, value) => {
          updateBookById(activeBook.id, (b) => ({
            ...b,
            rereads: b.rereads.map((r) => {
              if (r.stage !== stage) return r;
              const updated = { ...r, [field]: value };
              if (field === 'completed' && value === true && !r.date) {
                updated.date = selectedDate;
              }
              return updated;
            })
          }));
        };

        // 產生 Markdown（支援「今日跨書日誌匯出」與「單書完整筆記匯出」）

          if (exportType === 'daily') {

            dailyChaptersList.forEach((item, idx) => {
              const { bookTitle, bookAuthor, chapter } = item;
              md += `## 📖 書籍 ${idx + 1}：《${bookTitle}》（${bookAuthor}）\n`;
              md += `### 🔖 ${chapter.title}\n`;
              md += `- **⏱️ 閱讀耗時**：${chapter.durationMinutes || 0} 分鐘 ${chapter.timeSlot ? `（時段：${chapter.timeSlot}）` : ''} ${chapter.pageRange ? `｜ **頁碼**：${chapter.pageRange}` : ''}\n\n`;

              chapter.notes.forEach((n, nIdx) => {
                md += `#### 觀點轉化卡 #${nIdx + 1} ${n.page ? `(${n.page})` : ''}\n`;
                md += `- **💬 感觸金句（原文輸入）**：\n  > ${n.quote || '（未填寫）'}\n`;
                md += `- **💡 我的話語輸出（內化收穫）**：\n  ${n.paraphrase || '（未填寫）'}\n`;
                if (n.actionText?.trim()) {
                  md += `- **⚡ 觸發微行動**：[${n.actionDone ? 'x' : ' '}] ${n.actionText}\n`;
                  if (n.practiceLog?.trim()) {

            md += `- **🎯 閱讀目的**：\n  > ${b.purpose || '尚未填寫'}\n\n---\n\n`;

                md += `#### 筆記 ${idx + 1} ${n.page ? `(${n.page})` : ''} — *記錄於 ${n.recordedAt || ''}*\n`;
                md += `- **💬 感觸金句**：\n  > ${n.quote || '（未填寫）'}\n`;
                md += `- **💡 我的話語輸出**：\n  ${n.paraphrase || '（未填寫）'}\n`;

        // 共用元件：渲染單一章節內的「感觸金句 ➔ 我的話語輸出」卡片列表

                        {activeBook.tags.map((tag) => (
                          <span
                            key={tag}
                            className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs bg-stone-100 text-slate-700 border border-stone-200"
                          >
                            #{tag}
                            <button
                              onClick={() => handleRemoveTag(tag)}
                              className="text-stone-400 hover:text-red-600"
                            >
                              <X className="w-3 h-3" />
                            </button>
                          </span>
                        ))}
                        <form onSubmit={handleAddTag}>
                          <input
                            type="text"
                            value={newTagInput}
                            onChange={(e) => setNewTagInput(e.target.value)}
                            placeholder="+ 新增標籤"
                            className="px-2.5 py-0.5 text-xs rounded-full border border-dashed border-stone-300 w-28"
                          />
                        </form>
                      </div>
                    </div>
                  </section>

                  {/* STEP 2：逐章節「感觸金句 ➔ 我的話語輸出」 */}
                  <section className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-3 bg-white px-5 py-4 rounded-2xl border border-stone-200/90 shadow-sm">
                      <div>
                        <h2 className="text-base font-bold text-slate-900 flex items-center gap-2">
                          <MessageSquare className="w-5 h-5 text-emerald-800" />
                          <span>STEP 2 ｜ 逐章節「感觸金句 ➔ 我的話語輸出」完整脈絡</span>
                        </h2>
                        <p className="text-xs text-stone-500 mt-0.5">
                          點擊章節上的「閱讀日期」可一鍵切換回當天的跨書工作台，查看當天同時讀的另一本書
                        </p>
                      </div>

                      <div className="flex items-center gap-2">
                        <div className="relative">
                          <Search className="w-3.5 h-3.5 text-stone-400 absolute left-3 top-1/2 -translate-y-1/2" />
                          <input
                            type="text"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            placeholder="搜尋本書金句或輸出..."
                            className="pl-8 pr-3 py-1.5 text-xs rounded-lg border border-stone-200 bg-stone-50"
                          />
                        </div>
                        <button
                          onClick={handleAddChapterInSingleView}
                          className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-900 text-white hover:bg-emerald-800"
                        >
                          <Plus className="w-4 h-4" />
                          新增章節
                        </button>
                      </div>
                    </div>

                    <div className="space-y-5">
                      {filteredSingleBookChapters.map((chapter, chIdx) => (
                        <div
                          key={chapter.id}
                          className="bg-white rounded-2xl border border-stone-200/90 shadow-sm overflow-hidden"
                        >
                          <div className="bg-[#EFECE6]/90 px-5 py-3 border-b border-stone-200 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2 flex-1 min-w-[220px]">
                              <button
                                onClick={() =>
                                  handleUpdateChapter(
                                    activeBook.id,
                                    chapter.id,
                                    'isCollapsed',
                                    !chapter.isCollapsed
                                  )
                                }
                                className="p-1 rounded hover:bg-stone-200/80 text-stone-600"
                              >
                                {chapter.isCollapsed ? (
                                  <ChevronRight className="w-4 h-4" />
                                ) : (
                                  <ChevronDown className="w-4 h-4" />
                                )}
                              </button>
                              <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-emerald-900 text-stone-100">
                                CH.{chIdx + 1}
                              </span>
                              <input
                                type="text"
                                value={chapter.title}
                                onChange={(e) =>
                                  handleUpdateChapter(
                                    activeBook.id,
                                    chapter.id,
                                    'title',
                                    e.target.value
                                  )
                                }
                                className="w-full bg-transparent font-bold text-sm sm:text-base text-slate-900 focus:outline-none focus:bg-white px-2 py-0.5 rounded"
                              />
                            </div>

                            <div className="flex flex-wrap items-center gap-2 text-xs">
                              <div className="flex items-center gap-1 bg-white px-2.5 py-1 rounded-lg border border-stone-300/80">
                                <Calendar className="w-3.5 h-3.5 text-emerald-800" />
                                <input
                                  type="date"
                                  value={chapter.readDate || ''}
                                  onChange={(e) =>
                                    handleUpdateChapter(
                                      activeBook.id,
                                      chapter.id,
                                      'readDate',
                                      e.target.value
                                    )
                                  }
                                  className="bg-transparent text-xs font-mono text-slate-800 focus:outline-none"
                                />
                              </div>

                              <div className="flex items-center gap-1 bg-white px-2.5 py-1 rounded-lg border border-stone-300/80">
                                <Clock className="w-3.5 h-3.5 text-amber-700" />
                                <input
                                  type="number"
                                  min="0"
                                  max="999"
                                  value={chapter.durationMinutes ?? 0}
                                  onChange={(e) =>
                                    handleUpdateChapter(
                                      activeBook.id,
                                      chapter.id,
                                      'durationMinutes',
                                      Math.max(0, Number(e.target.value) || 0)
                                    )
                                  }
                                  className="w-11 bg-transparent text-xs font-mono font-bold text-center focus:outline-none"
                                />
                                <span className="text-[11px] text-stone-500">分</span>
                              </div>

                              <button
                                onClick={() => handleDeleteChapter(activeBook.id, chapter.id)}
                                className="p-1.5 text-stone-400 hover:text-red-600"
                                title="刪除此章節"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            </div>
                          </div>

                          {!chapter.isCollapsed &&
                            renderChapterNotes(activeBook.id, chapter, false)}
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* STEP 3：全書核心心得分享與行動踐行清單 */}
                  <section className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-6 bg-white rounded-2xl border border-stone-200/90 shadow-sm p-6 flex flex-col">
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2 mb-2">
                        <BookOpen className="w-5 h-5 text-emerald-800" />
                        <span>STEP 3 ｜ 全書核心心得分享</span>
                      </h3>
                      <p className="text-xs text-stone-500 mb-3">
                        回顧各章節自己寫下的話語輸出，統整這本書帶給你最大的觀點轉變：
                      </p>
                      <textarea
                        rows={6}
                        value={activeBook.synthesis}
                        onChange={(e) =>
                          updateBookById(activeBook.id, { synthesis: e.target.value })
                        }
                        placeholder="寫下全書總結心得..."
                        className="w-full flex-1 p-3.5 rounded-xl border border-stone-200 bg-stone-50 text-sm leading-relaxed focus:outline-none focus:bg-white"
                      />
                    </div>

                    <div className="lg:col-span-6 bg-white rounded-2xl border border-stone-200/90 shadow-sm p-6 flex flex-col">
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                          <Zap className="w-5 h-5 text-amber-600" />
                          <span>行動清單與踐行分享</span>
                        </h3>
                        <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900">
                          完成 {singleBookStats.completedActions} / {singleBookStats.aggregatedActions.length}
                        </span>
                      </div>
                      <p className="text-xs text-stone-500 mb-3">
                        自動彙整本書各章節的觸發行動，實際執行後請填寫「踐行分享」：
                      </p>
                      <div className="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                        {singleBookStats.aggregatedActions.map((act) => (
                          <div
                            key={act.noteId}
                            className="p-3 rounded-xl border border-stone-200 bg-stone-50/70 space-y-2"
                          >
                            <div className="flex items-start justify-between gap-2">
                              <button
                                onClick={() =>
                                  handleUpdateNoteCard(
                                    activeBook.id,
                                    act.chapterId,
                                    act.noteId,
                                    'actionDone',
                                    !act.actionDone
                                  )
                                }
                                className="flex items-start gap-2 text-left"
                              >
                                {act.actionDone ? (
                                  <CheckCircle2 className="w-4 h-4 text-emerald-700 shrink-0 mt-0.5" />
                                ) : (
                                  <Circle className="w-4 h-4 text-stone-400 shrink-0 mt-0.5" />
                                )}
                                <span
                                  className={`text-xs font-bold ${
                                    act.actionDone ? 'line-through text-stone-400' : 'text-slate-900'
                                  }`}
                                >
                                  {act.actionText}
                                </span>
                              </button>
                              <span className="text-[10px] font-mono text-stone-500 shrink-0">
                                {act.chapterDate}
                              </span>
                            </div>
                            <input
                              type="text"
                              value={act.practiceLog}
                              onChange={(e) =>
                                handleUpdateNoteCard(
                                  activeBook.id,
                                  act.chapterId,
                                  act.noteId,
                                  'practiceLog',
                                  e.target.value
                                )
                              }
                              placeholder="✍️ 填寫踐行分享：實際執行後的結果與回饋..."
                              className="w-full px-2.5 py-1 text-xs rounded border border-stone-200 bg-white"
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>

                  {/* STEP 4：三次間隔重讀打卡區 */}
                  <section className="bg-white rounded-2xl border border-stone-200/90 shadow-sm p-6">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                        <RotateCcw className="w-5 h-5 text-emerald-800" />
                        <span>STEP 4 ｜ 間隔重讀筆記打卡（第 1～3 次時間）</span>
                      </h3>
                      <div className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-xs font-bold text-amber-950">
                        <Award className="w-4 h-4 text-amber-600" />
                        <span>已完成 {singleBookStats.completedRereads} / 3 次重讀 — 你真棒！</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {activeBook.rereads.map((reread) => (
                        <div
                          key={reread.stage}
                          className={`rounded-xl p-4 border ${
                            reread.completed
                              ? 'bg-emerald-50/50 border-emerald-300'
                              : 'bg-stone-50/60 border-stone-200'
                          }`}
                        >
                          <button
                            onClick={() =>
                              handleUpdateReread(reread.stage, 'completed', !reread.completed)
                            }
                            className="flex items-center gap-2 mb-2.5 text-left"
                          >
                            {reread.completed ? (
                              <CheckCircle2 className="w-5 h-5 text-emerald-700" />
                            ) : (
                              <Circle className="w-5 h-5 text-stone-400" />
                            )}
                            <div>
                              <div className="text-xs font-bold text-slate-900">{reread.label}</div>
                              <div className="text-[10px] text-stone-500">{reread.hint}</div>
                            </div>
                          </button>
                          <input
                            type="date"
                            value={reread.date}
                            onChange={(e) =>
                              handleUpdateReread(reread.stage, 'date', e.target.value)
                            }
                            className="w-full px-2.5 py-1 text-xs rounded border border-stone-200 bg-white mb-2 font-mono"
                          />
                          <input
                            type="text"
                            value={reread.reflection}
                            onChange={(e) =>
                              handleUpdateReread(reread.stage, 'reflection', e.target.value)
                            }
                            placeholder="重讀體悟..."
                            className="w-full px-2.5 py-1 text-xs rounded border border-stone-200 bg-white"
                          />
                        </div>
                      ))}
                    </div>
                  </section>
                </main>
              </div>
            )}

            {/* 匯出 Markdown 彈窗 */}
            {showMarkdownModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-stone-200 overflow-hidden">
                  <div className="px-6 py-4 bg-stone-900 text-stone-100 flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <Download className="w-4 h-4 text-amber-400" />
                      <h3 className="text-sm font-bold">匯出 Markdown 筆記</h3>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setExportType('daily')}
                        className={`px-2.5 py-1 rounded text-xs font-semibold ${
                          exportType === 'daily'
                            ? 'bg-amber-400 text-slate-950'
                            : 'bg-stone-800 text-stone-300'
                        }`}
                      >
                        匯出 {selectedDate} 跨書日誌
                      </button>
                      <button
                        onClick={() => setExportType('book')}
                        className={`px-2.5 py-1 rounded text-xs font-semibold ${
                          exportType === 'book'
                            ? 'bg-amber-400 text-slate-950'
                            : 'bg-stone-800 text-stone-300'
                        }`}
                      >
                        匯出《{activeBook.title.slice(0, 8)}..》全書
                      </button>
                      <button
                        onClick={() => setShowMarkdownModal(false)}
                        className="text-stone-400 hover:text-white ml-2"
                      >
                        <X className="w-5 h-5" />
                      </button>
                    </div>
                  </div>

                  <div className="p-6 overflow-y-auto flex-1">
                    <pre className="p-4 rounded-xl bg-stone-900 text-stone-100 text-xs font-mono whitespace-pre-wrap leading-relaxed overflow-x-auto max-h-96">
                      {generateMarkdown()}
                    </pre>
                  </div>

                  <div className="px-6 py-4 bg-stone-50 border-t border-stone-200 flex items-center justify-end gap-3">
                    <button
                      onClick={() => setShowMarkdownModal(false)}
                      className="px-4 py-2 rounded-lg text-xs font-semibold text-stone-600 hover:bg-stone-200"
                    >
                      關閉
                    </button>
                    <button
                      onClick={handleCopyMarkdown}
                      className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold bg-emerald-900 text-white hover:bg-emerald-800"
                    >
                      <Copy className="w-3.5 h-3.5" />
                      複製 Markdown
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
